<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurfa Core</title>
  <script>
    (function() {
      var path = window.location.pathname.replace(/\/+$/, "").toLowerCase();
      if (path === "/projeler" || path.endsWith("/projeler")) {
        window.location.replace("/projeler/");
      } else if (path === "/sunumlar" || path.endsWith("/sunumlar")) {
        window.location.replace("/sunumlar/");
      } else if (path === "/siir-dinletisi" || path.endsWith("/siir-dinletisi")) {
        window.location.replace("/siir-dinletisi/");
      } else {
        window.location.replace("/");
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/" />
</head>
<body style="background:#0b0b10;color:#fff;display:grid;place-items:center;height:100vh;margin:0;font-family:sans-serif;">
  <p>Yönlendiriliyor…</p>
</body>
</html>
